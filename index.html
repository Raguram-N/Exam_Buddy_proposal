<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ExamBuddy AI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Tokens ---------- */
  :root{
    --ink:#14163E;
    --ink-soft:#23264F;
    --paper:#FFFBF4;
    --yellow:#FFC93C;
    --coral:#FF6B5B;
    --coral-deep:#C2362A;
    --mint:#3ECF8E;
    --text:#2B2B45;
    --text-muted:rgba(43,43,69,0.6);
    --line:rgba(20,22,62,0.12);
    --r-lg:28px;
    --r-md:18px;
    --r-sm:12px;
    --display:'Baloo Tamma 2', sans-serif;
    --body:'Work Sans', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:var(--body);
    color:var(--text);
    background:
      radial-gradient(circle at 20% 0%, rgba(255,201,60,0.10), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(62,207,142,0.10), transparent 45%),
      var(--ink);
    background-attachment:fixed;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 16px;
  }

  /* faint grid texture, like notebook graph paper, very subtle */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size:26px 26px;
    pointer-events:none;
  }

  /* ---------- Container ---------- */
  .container{
    position:relative;
    width:100%;
    max-width:380px;
    background:var(--paper);
    border-radius:var(--r-lg);
    padding:30px 24px 26px;
    box-shadow:
      0 30px 60px -24px rgba(20,22,62,0.55),
      0 10px 24px -12px rgba(20,22,62,0.35);
    animation:rise .6s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- Brand / Avatar (signature element) ---------- */
  .brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px;}
  .wordmark{font-family:var(--display); font-weight:700; font-size:22px; color:var(--ink); letter-spacing:0.01em;}
  .tagline{font-size:13px; color:var(--text-muted); text-align:center; margin-top:-4px;}

  .pulse-avatar{
    --size:64px;
    position:relative;
    width:var(--size); height:var(--size);
    display:flex; align-items:center; justify-content:center;
  }
  .pulse-avatar .ring{
    position:absolute; inset:0; border-radius:50%;
    border:2px solid var(--mint);
    opacity:0;
  }
  .pulse-avatar.idle .ring{ animation:breathe 3.2s ease-out infinite; }
  .pulse-avatar .ring:nth-child(2){ animation-delay:1.1s; }
  .pulse-avatar.is-live .ring{ animation:ripple 1.5s ease-out infinite; border-color:var(--mint); }
  .pulse-avatar.is-live .ring:nth-child(2){ animation-delay:.5s; }

  @keyframes breathe{
    0%{transform:scale(0.9); opacity:.35;}
    70%{transform:scale(1.35); opacity:0;}
    100%{transform:scale(1.35); opacity:0;}
  }
  @keyframes ripple{
    0%{transform:scale(0.85); opacity:.6;}
    100%{transform:scale(1.7); opacity:0;}
  }

  .orb{
    width:60%; height:60%;
    border-radius:50%;
    background:radial-gradient(circle at 32% 28%, var(--yellow), var(--coral));
    display:flex; align-items:center; justify-content:center;
    gap:3px;
    box-shadow:0 6px 16px -4px rgba(255,107,91,0.55);
  }
  .orb .bar{
    width:3px; border-radius:2px; background:var(--ink); height:8px;
    transition:height .25s ease;
  }
  .pulse-avatar.is-live .orb .bar{ animation:eq 1s ease-in-out infinite; }
  .orb .bar:nth-child(1){ animation-delay:.1s; }
  .orb .bar:nth-child(2){ animation-delay:.3s; }
  .orb .bar:nth-child(3){ animation-delay:.05s; }
  .orb .bar:nth-child(4){ animation-delay:.4s; }
  @keyframes eq{
    0%,100%{height:6px;}
    50%{height:16px;}
  }

  .pulse-avatar.call-size{ --size:108px; margin:0 auto 18px; }

  /* ---------- Form elements ---------- */
  .field{ margin-bottom:14px; }
  .field input{
    width:100%;
    padding:13px 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:#fff;
    font:500 14.5px var(--body);
    color:var(--text);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .field input::placeholder{ color:rgba(43,43,69,0.4); }
  .field input:focus-visible{
    border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(255,201,60,0.45);
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;
  }

  .warning{
    font-size:13px; font-weight:600; color:var(--coral-deep);
    min-height:0; max-height:0; opacity:0; overflow:hidden;
    transition:max-height .2s ease, opacity .2s ease;
    margin:-2px 0 4px;
  }
  .warning.show{ max-height:30px; opacity:1; margin-bottom:8px; }

  /* ---------- Buttons ---------- */
  .btn{
    width:100%;
    border:none;
    border-radius:999px;
    font-family:var(--body);
    font-weight:700;
    font-size:15px;
    padding:14px;
    cursor:pointer;
    transition:transform .12s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn:focus-visible{ outline:3px solid var(--yellow); outline-offset:2px; }

  .btn-primary{ background:var(--ink); color:var(--yellow); margin-top:4px; }
  .btn-primary:hover{ filter:brightness(1.15); }

  .btn-call{
    background:var(--mint); color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top:6px;
  }
  .btn-call:hover{ filter:brightness(1.06); }

  .btn-end{
    background:var(--coral); color:var(--ink);
    width:56px; height:56px; border-radius:50%;
    font-size:20px; display:flex; align-items:center; justify-content:center;
  }

  .btn-mic{
    background:#fff; border:1.5px solid var(--line); color:var(--ink);
    width:56px; height:56px; border-radius:50%; font-size:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-mic.muted{ background:var(--ink); color:var(--yellow); border-color:var(--ink); }

  .text-link{
    display:block; text-align:center; margin-top:16px;
    background:none; border:none; cursor:pointer;
    font:600 13px var(--body); color:var(--text-muted);
    text-decoration:underline; text-decoration-color:transparent;
    transition:text-decoration-color .15s;
  }
  .text-link:hover, .text-link:focus-visible{ text-decoration-color:var(--text-muted); }

  /* ---------- Dashboard ---------- */
  .greeting{ font-family:var(--display); font-weight:700; font-size:22px; color:var(--ink); margin:0 0 2px; }
  .subgreeting{ font-size:13.5px; color:var(--text-muted); margin:0 0 20px; }

  .eyebrow{
    font:700 11px var(--body); letter-spacing:0.09em; text-transform:uppercase;
    color:var(--text-muted); margin:0 0 10px;
  }

  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:#fff;
    font:600 14px var(--body);
    color:var(--text);
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s, transform .12s;
  }
  .chip:active{ transform:scale(0.95); }
  .chip.selected{ background:var(--ink); color:var(--yellow); border-color:var(--ink); }
  .chip:focus-visible{ outline:3px solid var(--yellow); outline-offset:1px; }

  .subject-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;
  }
  .subject-card{
    border:1.5px solid var(--line); background:#fff;
    border-radius:var(--r-md);
    padding:14px 8px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    cursor:pointer;
    font:600 13.5px var(--body); color:var(--text);
    transition:background .15s, color .15s, border-color .15s, transform .12s;
  }
  .subject-card:active{ transform:scale(0.96); }
  .subject-card .emoji{ font-size:21px; }
  .subject-card.selected{ background:var(--ink); color:var(--yellow); border-color:var(--ink); }
  .subject-card:focus-visible{ outline:3px solid var(--yellow); outline-offset:1px; }

  /* ---------- Call screen ---------- */
  .call-meta{
    text-align:center; font:600 13px var(--body); color:var(--text-muted);
    background:rgba(20,22,62,0.06); border-radius:999px; padding:6px 14px;
    display:inline-block; margin:0 auto 18px; width:auto;
  }
  .call-meta-wrap{ text-align:center; margin-bottom:4px; }

  .call-status{
    text-align:center; font:700 16px var(--display); color:var(--ink);
    margin:0 0 6px;
  }
  .call-timer{
    text-align:center; font:600 26px var(--mono); color:var(--ink);
    margin:0 0 26px; letter-spacing:0.02em;
  }
  .call-controls{ display:flex; justify-content:center; gap:22px; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:28px;
    transform:translate(-50%, 12px);
    background:var(--ink); color:var(--yellow);
    font:600 13.5px var(--body);
    padding:11px 18px; border-radius:999px;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 14px 30px -10px rgba(0,0,0,0.5);
    z-index:10;
  }
  .toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){
    .container{ animation:none; }
    .pulse-avatar .ring{ animation:none !important; opacity:0; }
    .orb .bar{ animation:none !important; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- LOGIN SCREEN -->
  <section class="screen active" id="screen-login" aria-label="Login">
    <div class="brand">
      <div class="pulse-avatar idle">
        <div class="ring"></div><div class="ring"></div>
        <div class="orb"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
      </div>
      <div class="wordmark">ExamBuddy AI</div>
      <p class="tagline">Your tutor's on speed dial.<br>Log in, pick a subject, and just start talking.</p>
    </div>

    <div class="field">
      <label class="sr-only" for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username" autocomplete="username"/>
    </div>
    <div class="field">
      <label class="sr-only" for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
    </div>
    <p class="warning" id="loginWarning" role="alert"></p>
    <button class="btn btn-primary" onclick="handleLogin()">Log In</button>
  </section>

  <!-- DASHBOARD SCREEN -->
  <section class="screen" id="screen-dashboard" aria-label="Dashboard">
    <p class="greeting">Hey, <span id="studentName">there</span> 👋</p>
    <p class="subgreeting">Pick your standard and subject, then call your tutor.</p>

    <p class="eyebrow">Standard</p>
    <div class="chip-row" id="stdRow" role="group" aria-label="Select standard">
      <!-- chips injected by JS -->
    </div>

    <p class="eyebrow">Subject</p>
    <div class="subject-grid" id="subjectGrid" role="group" aria-label="Select subject">
      <!-- cards injected by JS -->
    </div>

    <p class="warning" id="dashWarning" role="alert"></p>
    <button class="btn btn-call" onclick="startCall()">📞 Call ExamBuddy AI</button>
    <button class="text-link" onclick="logout()">Log out</button>
  </section>

  <!-- CALL SCREEN -->
  <section class="screen" id="screen-call" aria-label="Call in progress">
    <div class="pulse-avatar call-size" id="avatarCall">
      <div class="ring"></div><div class="ring"></div>
      <div class="orb"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
    </div>

    <div class="call-meta-wrap">
      <span class="call-meta" id="callMeta">Std — · Subject</span>
    </div>
    <p class="call-status" id="callStatusLabel">Connecting to ExamBuddy AI…</p>
    <p class="call-timer" id="callTimer">00:00</p>

    <div class="call-controls">
      <button class="btn-mic" id="micBtn" onclick="toggleMic(this)" aria-label="Mute microphone">🎙️</button>
      <button class="btn-end" onclick="endCall()" aria-label="End call">📴</button>
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<script>
  const STANDARDS = [6,7,8,9,10,11,12];
  const SUBJECTS = [
    {label:"Science", emoji:"🔬"},
    {label:"Maths", emoji:"➗"},
    {label:"Social Science", emoji:"🌍"},
    {label:"English", emoji:"📖"},
    {label:"Tamil", emoji:"📜"},
  ];

  let selectedStd = null;
  let selectedSubject = null;
  let timerInterval = null;
  let elapsedSeconds = 0;

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function buildChips(){
    const stdRow = document.getElementById('stdRow');
    STANDARDS.forEach(std => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip';
      btn.textContent = 'Std ' + std;
      btn.setAttribute('data-group', 'std');
      btn.onclick = () => {
        document.querySelectorAll('.chip[data-group="std"]').forEach(c => c.classList.remove('selected'));
        btn.classList.add('selected');
        selectedStd = std;
      };
      stdRow.appendChild(btn);
    });

    const grid = document.getElementById('subjectGrid');
    SUBJECTS.forEach(sub => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'subject-card';
      card.setAttribute('data-group', 'subject');
      card.innerHTML = '<span class="emoji">' + sub.emoji + '</span><span>' + sub.label + '</span>';
      card.onclick = () => {
        document.querySelectorAll('.subject-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedSubject = sub.label;
      };
      grid.appendChild(card);
    });
  }
  buildChips();

  function handleLogin(){
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    const warn = document.getElementById('loginWarning');
    if(!user || !pass){
      warn.textContent = "Enter both your username and password.";
      warn.classList.add('show');
      return;
    }
    warn.classList.remove('show');
    document.getElementById('studentName').textContent = user;
    showScreen('screen-dashboard');
  }

  function startCall(){
    const warn = document.getElementById('dashWarning');
    if(!selectedStd || !selectedSubject){
      warn.textContent = "Pick your standard and subject first.";
      warn.classList.add('show');
      return;
    }
    warn.classList.remove('show');

    document.getElementById('callMeta').textContent = 'Std ' + selectedStd + ' · ' + selectedSubject;
    document.getElementById('callStatusLabel').textContent = 'Connecting to ExamBuddy AI…';
    document.getElementById('callTimer').textContent = '00:00';
    document.getElementById('avatarCall').classList.remove('is-live');
    elapsedSeconds = 0;
    clearInterval(timerInterval);

    showScreen('screen-call');

    setTimeout(() => {
      document.getElementById('callStatusLabel').textContent = 'Connected';
      document.getElementById('avatarCall').classList.add('is-live');
      timerInterval = setInterval(() => {
        elapsedSeconds++;
        const m = String(Math.floor(elapsedSeconds/60)).padStart(2,'0');
        const s = String(elapsedSeconds%60).padStart(2,'0');
        document.getElementById('callTimer').textContent = m + ':' + s;
      }, 1000);
    }, 1400);
  }

  function toggleMic(btn){
    const muted = btn.classList.toggle('muted');
    btn.setAttribute('aria-label', muted ? 'Unmute microphone' : 'Mute microphone');
    btn.textContent = muted ? '🔇' : '🎙️';
    const live = document.getElementById('callStatusLabel').textContent === 'Connected';
    document.getElementById('avatarCall').classList.toggle('is-live', live && !muted);
  }

  function endCall(){
    clearInterval(timerInterval);
    showScreen('screen-dashboard');
    showToast('Call ended — nice work! 🎉');
  }

  function logout(){
    clearInterval(timerInterval);
    showScreen('screen-login');
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    selectedStd = null;
    selectedSubject = null;
    document.querySelectorAll('.chip.selected, .subject-card.selected').forEach(el => el.classList.remove('selected'));
  }

  function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
